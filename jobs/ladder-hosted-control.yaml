# The difficulty ladder (PRD Part II), hosted control job: Haiku and Sonnet
# x control x TypeScript and Go, on every rung, at -k 1. Harbor sets extra
# instructions per job, so the two conditions are two jobs.
#
# The task packs: one TypeScript and one Go pack for each rung, in ladder
# order. The four ladder-*.yaml jobs list the same packs; a new rung adds its
# two lines to each of them.
#
# Run it through the experiment:  uv run assay experiment difficulty-ladder

job_name: ladder-hosted-control
jobs_dir: results
n_attempts: 1

tasks:
  # Rung 1: split-second-stopwatch (a state machine).
  - path: tasks/typescript/split-second-stopwatch
  - path: tasks/go/split-second-stopwatch

agents:
  # Control: no variant flags (no skills, no settings, no extra instructions).
  - import_path: instruments.agent:InstrumentedClaudeCode
    model_name: anthropic/claude-haiku-5-5
    kwargs:
      # Claude Code version: the same value in all the job files (PRD "Version pins").
      version: &claude_code_version "2.1.308"
    env: &hosted_env
      DISABLE_NON_ESSENTIAL_MODEL_CALLS: "1"   # every model tier (L9)
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

  - import_path: instruments.agent:InstrumentedClaudeCode
    model_name: anthropic/claude-sonnet-5-5
    kwargs:
      version: *claude_code_version
    env: *hosted_env
