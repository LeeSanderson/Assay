# Phase 0, the cross job, control half: Haiku and Sonnet x control
# x TypeScript and Go, at -k 1. 4 trials. phase0-cross-tdd.yaml is the
# instrument-tdd half: Harbor sets extra instructions per job, so the two
# conditions are two jobs.
#
# Launch from the repository root:  uv run assay run -c jobs/phase0-cross-control.yaml -y --debug
# See README.md, "Run the Phase 0 jobs".

job_name: phase0-cross-control
jobs_dir: results
n_attempts: 1

tasks:
  - path: tasks/typescript/split-second-stopwatch
  - path: tasks/go/split-second-stopwatch

agents:
  # Control: no variant flags (no skills, no settings, no extra instructions).
  - import_path: instruments.agent:InstrumentedClaudeCode
    model_name: anthropic/claude-haiku-5-5
    kwargs:
      # Claude Code version: the same value in all the job files (PRD "Version pins").
      version: &claude_code_version "2.1.308"
    env: &hosted_env
      DISABLE_NON_ESSENTIAL_MODEL_CALLS: "1"   # every model tier (L9)
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

  - import_path: instruments.agent:InstrumentedClaudeCode
    model_name: anthropic/claude-sonnet-5-5
    kwargs:
      version: *claude_code_version
    env: *hosted_env
