# The difficulty ladder (PRD Part II), local instrument-tdd job: the local
# tier x instrument-tdd x TypeScript and Go, on every rung, at -k 1, against
# a local model server. A separate job, because timeout_multiplier applies to
# the whole job (L4).
#
# The task packs: the same as in the other three ladder-*.yaml jobs.
#
# Run it last, on the host of the local server, with ASSAY_LOCAL_BASE_URL set
# there (the server address lives in that one setting only, L10):
#   uv run assay experiment difficulty-ladder --job ladder-local-tdd
# See jobs/phase0-local.yaml for the form of the address.

job_name: ladder-local-tdd
jobs_dir: results
n_attempts: 1
# instrument-tdd: the skill's description alone did not load it on the smoke
# trial, so the prompt names it (PRD "The phase 0 instrument").
extra_instruction_paths: [variants/instrument-tdd/extra-instruction.md]
n_concurrent_trials: 1
timeout_multiplier: 3.0             # job level; no agent has this key (L4)

tasks:
  # Rung 1: split-second-stopwatch (a state machine).
  - path: tasks/typescript/split-second-stopwatch
  - path: tasks/go/split-second-stopwatch

agents:
  # instrument-tdd (parts from variants/instrument-tdd/): the skill, and the extra instruction above.
  - import_path: instruments.agent:InstrumentedClaudeCode
    model_name: laguna-s-2.1        # bare name: the server receives this exact name
    concurrency_group: local-llm    # one server slot (L3)
    n_concurrent: 1
    skills: [variants/instrument-tdd/tdd]
    kwargs:
      # Claude Code version: the same value in all the job files (PRD "Version pins").
      version: "2.1.308"
    env:
      ANTHROPIC_BASE_URL: "${ASSAY_LOCAL_BASE_URL}"   # the one setting (L10)
      ANTHROPIC_API_KEY: dummy
      DISABLE_NON_ESSENTIAL_MODEL_CALLS: "1"          # every model tier (L9)
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
