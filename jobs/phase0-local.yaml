# Phase 0, the local job: 1 trial in the instrument-tdd condition against a
# local model server. A separate job, because timeout_multiplier applies to the
# whole job (L4). Record the local setup in phase0-local.L6.md before the run.
#
# Launch from the repository root, with ASSAY_LOCAL_BASE_URL set on the host
# (the server address lives in that one setting only, L10):
#   PowerShell:  $env:ASSAY_LOCAL_BASE_URL = "http://192.168.1.252:8080"
#   bash:        export ASSAY_LOCAL_BASE_URL=http://192.168.1.252:8080
#   uv run assay run -c jobs/phase0-local.yaml -y --debug
# The value is the server root: no trailing slash and no /v1, because Claude
# Code adds /v1/messages itself. Use an address the container can reach (a LAN
# address, not localhost or host.docker.internal, L7). The server must serve
# the Anthropic Messages API.
# See README.md, "Run the Phase 0 jobs".

job_name: phase0-local
jobs_dir: results
n_attempts: 1
n_concurrent_trials: 1
timeout_multiplier: 3.0             # job level; no agent has this key (L4)

tasks:
  # SET AFTER THE HOSTED TRIALS: the one task pack for the local trial
  # (tasks/typescript/... or tasks/go/...). This is the only value to change.
  - path: tasks/typescript/split-second-stopwatch

agents:
  # instrument-tdd (variants/variants.toml): the skills part only.
  - import_path: instruments.agent:InstrumentedClaudeCode
    model_name: laguna-s-2.1        # bare name: the server receives this exact name
    concurrency_group: local-llm    # one server slot (L3)
    n_concurrent: 1
    skills: [variants/instrument-tdd/tdd]
    kwargs:
      # Claude Code version: the same value in all three job files (PRD "Version pins").
      version: "2.1.308"
    env:
      ANTHROPIC_BASE_URL: "${ASSAY_LOCAL_BASE_URL}"   # the one setting (L10), e.g. http://192.168.1.252:8080
      ANTHROPIC_API_KEY: dummy
      DISABLE_NON_ESSENTIAL_MODEL_CALLS: "1"          # every model tier (L9)
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
