# environment/seed's *.test.ts files, and tests/seed-suite holds a copy of them.
[metadata]
language = "typescript"
base_image = "node:22.23.4-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384"

[agent]
