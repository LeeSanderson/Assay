schema_version = "1.4"

# Rung D of the codebase ladder (PRD section 20; issue #84): partial returns
# and refunds (X), a cross-cutting feature, in the small codebase of the order
# and inventory service with the gold solution of the promotions engine (M).
# The seed is rung C's seed with rung C's gold solution added, and nothing else
# (but the package name). A purpose-written pack (ADR 0006), the same as
# tasks/go/shop-returns-small but for the language. Its tests/test.sh is the
# model pack's with the slug swapped. The seed has no stub: the feature adds
# returns.ts, so the unchanged seed fails the feature tests at the type check.
# The specification, the Interface section and the feature tests are rung E's
# too. tests/seed-suite holds the seed suite (the seed's *.test.ts files) in
# its seed form.
[metadata]
language = "typescript"
rung = "D"
seed_size = "small"
feature_size = "X"
feature_tests = 38
seed_suite_tests = 59
seed_files = [
    "cart.test.ts",
    "cart.ts",
    "catalogue.test.ts",
    "catalogue.ts",
    "checkout.test.ts",
    "checkout.ts",
    "clock.test.ts",
    "clock.ts",
    "inventory.test.ts",
    "inventory.ts",
    "orders.test.ts",
    "orders.ts",
    "payments.test.ts",
    "payments.ts",
    "promotions.ts",
    "receipt.test.ts",
    "receipt.ts",
    "package.json",
    "yarn.lock",
    ".yarnrc.yml",
    "tsconfig.json",
    "jest.config.cjs",
    "babel.config.cjs",
    "eslint.config.mjs",
]
# tests/test.sh: agent tests compile only if tsc passes and every Jest suite
# loads. When agent test files (`*.test.ts`, `*.spec.ts`) exist but do not
# compile, agent_tests_passed is 0 and agent_tests_total is max(counted tests,
# agent test files), so replay labels the snapshot red-compile, not no-tests.
red_compile_rule = "agent test files exist and do not compile: agent_tests_passed = 0, agent_tests_total = max(counted tests, agent test files)"
base_image = "node:22.23.4-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384"

# PRD section 20, check 3: the blind solve, run by jobs/codebase-ladder-blind-solve.yaml.
# Each failed hidden test names the sentence of the Interface section that states it.
# The seed suite passed too (59 of 59).
[metadata.blind_solve]
model = "claude-opus-5-5"
condition = "control"
date = "2026-11-14"
reward = 1
reference_passed = 38
reference_total = 38
cost_usd = 0.62
failed = []

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
cpus = 2
memory_mb = 4096
network_mode = "public"
