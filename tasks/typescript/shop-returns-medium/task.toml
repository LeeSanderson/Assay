schema_version = "1.4"

# Rung E of the codebase ladder (PRD section 20; issue #87): partial returns
# and refunds (X) in the medium codebase of the order and inventory service
# (issues #85 and #86; docs/codebase-ladder/medium-codebase.md). Rung E turns
# only the seed-size dial from rung D: instruction.md and the feature tests
# are rung D's, byte for byte. A purpose-written pack (ADR 0006), the same as
# tasks/go/shop-returns-medium but for the language. Its tests/test.sh
# is the model pack's with the slug swapped. The seed has no stub: the feature
# adds returns.ts, so the unchanged seed fails the feature tests at
# the type check. The event log, the reports and the shipping are not in the
# specification of X; the seed suite covers them. tests/seed-suite holds the
# seed suite (the seed's *.test.ts files) in its seed form.
[metadata]
language = "typescript"
rung = "E"
seed_size = "medium"
feature_size = "X"
feature_tests = 38
seed_suite_tests = 291
