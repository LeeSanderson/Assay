schema_version = "1.4"

[metadata]
language = "typescript"
exercise = "two-bucket"
source_repo = "https://github.com/exercism/typescript"
source_commit = "a24e6ae756c61932165bb7d0a2703417a8291af3"
# Each copied path, relative to the source repository, mapped to its place in this pack.
copied_paths = [
    "exercises/practice/two-bucket/.docs/instructions.md",
    "exercises/practice/two-bucket/two-bucket.ts",
    "exercises/practice/two-bucket/package.json",
    "exercises/practice/two-bucket/.yarnrc.yml",
    "exercises/practice/two-bucket/tsconfig.json",
    "exercises/practice/two-bucket/jest.config.cjs",
    "exercises/practice/two-bucket/babel.config.cjs",
    "exercises/practice/two-bucket/eslint.config.mjs",
    "exercises/practice/two-bucket/two-bucket.test.ts",
    "exercises/practice/two-bucket/.meta/proof.ci.ts",
]
copied_to = [
    "instruction.md",
    "environment/seed/two-bucket.ts",
    "environment/seed/package.json",
    "environment/seed/.yarnrc.yml",
    "environment/seed/tsconfig.json",
    "environment/seed/jest.config.cjs",
    "environment/seed/babel.config.cjs",
    "environment/seed/eslint.config.mjs",
    "tests/assay-reference.two-bucket.test.ts",
    "solution/proof.ci.ts",
]
mechanical_changes = [
    "two-bucket.test.ts: xit( -> it( (10 tests) and xdescribe( -> describe( (6 blocks); the unused xit and xdescribe imports stay",
    "two-bucket.test.ts renamed to assay-reference.two-bucket.test.ts",
    "instruction.md: the fixed Assay footer appended after .docs/instructions.md",
    "instruction.md: an Interface section, written from the reference tests only, inserted before the footer (the constructor arguments, what moves(), goalBucket and otherBucket give, and that moves() throws when the goal cannot be reached; the reference tests accept any error)",
    "package.json: the `test` script `corepack yarn node test-runner.mjs` -> `corepack yarn lint:types && corepack yarn test:implementation`; test-runner.mjs is a track-level file that needs .meta/config.json, and these are the steps it runs for this exercise (tsc, then jest; tstyche is off)",
    "package.json: name `@exercism/typescript-two-bucket` -> `two-bucket`; the description and repository URL removed",
    "tsconfig.json: the `display` line and the `.meta/*.ts`, `.meta/*.tsx` includes removed",
    "babel.config.cjs: the `@exercism/babel-preset-typescript` wrapper replaced by the presets it wraps, `@babel/preset-env` (targets node current, useBuiltIns usage, corejs 3.38) and `@babel/preset-typescript`; package.json gains them and `@babel/core` in place of the wrapper",
    "eslint.config.mjs: the `@exercism/eslint-config-typescript` config and its maintainers config replaced by a plain `typescript-eslint` recommended config with the same ignores",
    "yarn.lock: the source file is empty; the pack holds the split-second-stopwatch pack's lock with its workspace entry renamed to `two-bucket` by `corepack yarn install` (yarn 4.5.1) in the base image; no @exercism package",
    "two-bucket.ts: the boilerplate `'Remove this line and implement the function'` -> `'Not implemented'`",
    "two-bucket.ts: the stub's `constructor()` took no parameter, so the reference tests, which pass four arguments, did not type-check against it; it becomes `constructor(buckOne: unknown, buckTwo: unknown, goal: unknown, starterBuck: unknown)` (the names the reference tests use); every other exported name and signature unchanged",
    "proof.ci.ts: `private moves(): number` -> `public moves(): number`; the reference tests call moves(), so the gold solution did not type-check against them",
]
seed_files = [
    "two-bucket.ts",
    "package.json",
    "yarn.lock",
    ".yarnrc.yml",
    "tsconfig.json",
    "jest.config.cjs",
    "babel.config.cjs",
    "eslint.config.mjs",
]
# tests/test.sh: agent tests compile only if tsc passes and every Jest suite
# loads. When agent test files (`*.test.ts`, `*.spec.ts`) exist but do not
# compile, agent_tests_passed is 0 and agent_tests_total is max(counted tests,
# agent test files), so replay labels the snapshot red-compile, not no-tests.
red_compile_rule = "agent test files exist and do not compile: agent_tests_passed = 0, agent_tests_total = max(counted tests, agent test files)"
base_image = "node:22.23.4-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 600.0

[environment]
cpus = 2
memory_mb = 4096
network_mode = "public"
