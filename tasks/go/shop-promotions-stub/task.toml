schema_version = "1.4"

# Rung B of the codebase ladder (PRD section 20; issue #81): the promotions
# engine (M) of the order and inventory domain, built from a stub. A
# purpose-written pack (ADR 0006), the same as tasks/typescript/shop-promotions-stub
# but for the language. Its tests/test.sh is the model pack's with the slug
# swapped. The seed suite is empty, so tests/seed-suite does not exist.
[metadata]
language = "go"
rung = "B"
seed_size = "stub"
feature_size = "M"
feature_tests = 48
seed_suite_tests = 0
seed_files = ["go.mod", "promotions.go"]
# tests/test.sh: when agent test files (`*_test.go`) exist but do not compile,
# agent_tests_passed is 0 and agent_tests_total is max(counted tests, agent test
# files), so replay labels the snapshot red-compile, not no-tests.
red_compile_rule = "agent test files exist and do not compile: agent_tests_passed = 0, agent_tests_total = max(counted tests, agent test files)"
base_image = "golang:1.27.3-bookworm@sha256:972b4110ba0f47539a975c31e52c64765e1ff19f2d74469ae4a595c6676e80a5"

# PRD section 20, check 3: the blind solve, run by jobs/codebase-ladder-blind-solve.yaml.
# Each failed hidden test names the sentence of the Interface section that states it.
[metadata.blind_solve]
model = "claude-opus-5-5"
condition = "control"
date = "2026-11-14"
reward = 1
reference_passed = 48
reference_total = 48
cost_usd = 0.20
failed = []

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
cpus = 2
memory_mb = 4096
network_mode = "public"
