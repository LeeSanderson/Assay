schema_version = "1.4"

# Rung D of the codebase ladder (PRD section 20; issue #84): partial returns
# and refunds (X), a cross-cutting feature, in the small codebase of the order
# and inventory service with the gold solution of the promotions engine (M).
# The seed is rung C's seed with rung C's gold solution added, and nothing
# else. A purpose-written pack (ADR 0006), the same as
# tasks/typescript/shop-returns-small but for the language. Its tests/test.sh
# is the model pack's with the slug swapped. The seed has no stub: the feature
# adds returns.go, so the unchanged seed fails the feature tests at the build.
# The specification, the Interface section and the feature tests are rung E's
# too. tests/seed-suite holds the seed suite (the seed's *_test.go files) in
# its seed form.
[metadata]
language = "go"
rung = "D"
seed_size = "small"
feature_size = "X"
feature_tests = 38
seed_suite_tests = 59
seed_files = [
    "cart.go",
    "cart_test.go",
    "catalogue.go",
    "catalogue_test.go",
    "checkout.go",
    "checkout_test.go",
    "clock.go",
    "clock_test.go",
    "go.mod",
    "inventory.go",
    "inventory_test.go",
    "orders.go",
    "orders_test.go",
    "payments.go",
    "payments_test.go",
    "promotions.go",
    "receipt.go",
    "receipt_test.go",
]
# tests/test.sh: when agent test files (`*_test.go`) exist but do not compile,
# agent_tests_passed is 0 and agent_tests_total is max(counted tests, agent test
# files), so replay labels the snapshot red-compile, not no-tests.
red_compile_rule = "agent test files exist and do not compile: agent_tests_passed = 0, agent_tests_total = max(counted tests, agent test files)"
base_image = "golang:1.27.3-bookworm@sha256:972b4110ba0f47539a975c31e52c64765e1ff19f2d74469ae4a595c6676e80a5"

# PRD section 20, check 3: the blind solve, run by jobs/codebase-ladder-blind-solve.yaml.
# Each failed hidden test names the sentence of the Interface section that states it.
# The seed suite passed too (59 of 59).
[metadata.blind_solve]
model = "claude-opus-5-5"
condition = "control"
date = "2026-11-14"
reward = 1
reference_passed = 38
reference_total = 38
cost_usd = 0.60
failed = []

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[environment]
cpus = 2
memory_mb = 4096
network_mode = "public"
