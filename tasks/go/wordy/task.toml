schema_version = "1.4"

[metadata]
language = "go"
source_repo = "https://github.com/exercism/go"
source_commit = "74f09b25dd12c14571cc684a7cb57149634037bd"
source_dir = "exercises/practice/wordy"
# Source paths in the Exercism repository; `pack_paths` gives where each one is
# in this pack, in the same order.
copied_paths = [
    "exercises/practice/wordy/.docs/instructions.md",
    "exercises/practice/wordy/wordy.go",
    "exercises/practice/wordy/go.mod",
    "exercises/practice/wordy/wordy_test.go",
    "exercises/practice/wordy/cases_test.go",
    "exercises/practice/wordy/.meta/example.go",
]
pack_paths = [
    "instruction.md",
    "environment/seed/wordy.go",
    "environment/seed/go.mod",
    "tests/reference/assay_reference_wordy_test.go",
    "tests/reference/assay_reference_cases_test.go",
    "solution/example.go",
]
mechanical_changes = [
    "renamed wordy_test.go -> assay_reference_wordy_test.go",
    "renamed cases_test.go -> assay_reference_cases_test.go",
    "instruction.md: appended the fixed Assay footer after .docs/instructions.md",
    "instruction.md: added an Interface section between the source prose and the footer, derived from the reference tests only (the question format, the integer and negative operands, the four operations, when Answer returns true and when false)",
    "environment/seed/wordy.go: replaced the `panic(\"Please implement the Answer function\")` body with `panic(\"not implemented\")`; the exported name, signature and the module name are unchanged",
]
seed_files = ["go.mod", "wordy.go"]
# tests/test.sh: when agent test files (`*_test.go`) exist but do not compile,
# agent_tests_passed is 0 and agent_tests_total is max(counted tests, agent test
# files), so replay labels the snapshot red-compile, not no-tests.
red_compile_rule = "agent test files exist and do not compile: agent_tests_passed = 0, agent_tests_total = max(counted tests, agent test files)"
base_image = "golang:1.27.3-bookworm@sha256:972b4110ba0f47539a975c31e52c64765e1ff19f2d74469ae4a595c6676e80a5"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 600.0

[environment]
cpus = 2
memory_mb = 4096
network_mode = "public"
