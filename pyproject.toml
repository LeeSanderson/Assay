[project]
name = "assay"
version = "0.1.0"
description = "Measures the value of a context artifact for a coding agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.24.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = [
    "slow: needs Docker or Harbor; skipped by default, run with `uv run pytest -m slow` or `-m \"\"`",
]
